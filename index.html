<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1, user-scalable=no">
    <title>Half-Life 2 - Port</title>

    <link rel="icon" type="image/png" href="assets/hl2.png">

    <script>
      window.coi = {
        shouldRegister: () => !window.crossOriginIsolated,
        shouldDeregister: () => false,
        coepCredentialless: () => true,
        doReload: () => window.location.reload()
      };
    </script>
    <script src="coi-serviceworker.js"></script>
    <script>
      if (!window.crossOriginIsolated && 'serviceWorker' in navigator) {
        navigator.serviceWorker.ready.then((reg) => {
          if (reg.active && !navigator.serviceWorker.controller) {
            window.location.reload();
          }
        });
      }
    </script>

    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }

      @font-face {
        font-family: 'LambdaMono';
        src: local('Consolas'), local('Lucida Console'), local('Courier New'), monospace;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #000;
        color: #d8dde3;
        font-family: 'LambdaMono', -apple-system, monospace;
      }

      #game-wrapper {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
      }

      #canvas {
        width: 100vw;
        height: 100vh;
        object-fit: contain;
        display: block;
        outline: none;
        background: #000;
        cursor: default;
        pointer-events: auto;
      }

      #launcher-ui {
        position: fixed;
        inset: 0;
        z-index: 50;
        background: radial-gradient(circle at 50% 45%, #1c1815 0%, #0d0c0a 70%, #050504 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      #launcher-ui::before {
        content: " ";
        display: block;
        position: absolute;
        inset: 0;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
        background-size: 100% 4px;
        z-index: 51;
        pointer-events: none;
        opacity: 0.6;
      }

      #launcher-ui.hidden {
        display: none !important;
      }

      .terminal-frame {
        position: relative;
        z-index: 52;
        background: rgba(18, 17, 16, 0.95);
        border: 1px solid #332d28;
        border-top: 3px solid #ff7b00;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9), 0 0 30px rgba(255, 123, 0, 0.12);
        width: 100%;
        max-width: 580px;
        padding: 2.2rem;
      }

      .header-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px dashed #2d2621;
        padding-bottom: 0.8rem;
        margin-bottom: 1.5rem;
        font-size: 0.72rem;
        letter-spacing: 0.15em;
        color: #8c827a;
      }

      .header-meta .tag-id {
        color: #ff7b00;
        font-weight: 700;
      }

      .brand-row {
        display: flex;
        align-items: baseline;
        gap: 14px;
        margin-bottom: 0.4rem;
      }

      .brand-title {
        font-size: 2.1rem;
        font-weight: 900;
        letter-spacing: 0.18em;
        color: #f7ede2;
        text-transform: uppercase;
        text-shadow: 0 0 16px rgba(255, 123, 0, 0.35);
      }

      .brand-sub {
        font-size: 0.75rem;
        color: #ffa200;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }

      .log-console {
        background: #080706;
        border: 1px solid #1f1b18;
        padding: 0.9rem 1.1rem;
        margin: 1.4rem 0;
        font-size: 0.78rem;
        line-height: 1.6;
        color: #8c827a;
      }

      .log-console .log-entry {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .log-console .log-entry span {
        color: #ff7b00;
      }

      .btn-terminal {
        width: 100%;
        background: #ff7b00;
        color: #120e0a;
        border: 1px solid #ff7b00;
        padding: 1rem;
        font-family: inherit;
        font-size: 0.88rem;
        font-weight: 800;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.15s ease-out;
      }

      .btn-terminal:hover:not(:disabled) {
        background: #ffa200;
        border-color: #ffa200;
        box-shadow: 0 0 20px rgba(255, 162, 0, 0.4);
      }

      .btn-terminal:disabled {
        background: #1a1715;
        border-color: #2b2520;
        color: #595048;
        cursor: not-allowed;
      }

      #progress-box {
        display: none;
        margin-top: 1.4rem;
      }

      .meter-labels {
        display: flex;
        justify-content: space-between;
        font-size: 0.74rem;
        color: #8c827a;
        margin-bottom: 0.4rem;
        letter-spacing: 0.08em;
      }

      .meter-labels #txt-pct {
        color: #ff7b00;
        font-weight: bold;
      }

      .meter-rail {
        width: 100%;
        height: 8px;
        background: #080706;
        border: 1px solid #2b2520;
        overflow: hidden;
      }

      .meter-fill {
        width: 0%;
        height: 100%;
        background: linear-gradient(90deg, #d45b00, #ff7b00);
        box-shadow: 0 0 10px rgba(255, 123, 0, 0.5);
        transition: width 0.08s linear;
      }

      .meter-sub {
        display: flex;
        justify-content: space-between;
        font-size: 0.68rem;
        color: #595048;
        margin-top: 0.45rem;
      }

      #crash-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        background: rgba(8, 7, 6, 0.95);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      #crash-overlay.active {
        display: flex !important;
      }

      .crash-card {
        background: #141210;
        border: 1px solid #e63946;
        max-width: 680px;
        width: 100%;
        padding: 1.8rem;
        box-shadow: 0 0 40px rgba(230, 57, 70, 0.2);
      }

      .crash-title {
        color: #e63946;
        font-size: 0.88rem;
        font-weight: bold;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 0.8rem;
      }

      .crash-pre {
        background: #080706;
        color: #ff858d;
        font-size: 0.75rem;
        padding: 1rem;
        max-height: 260px;
        overflow-y: auto;
        white-space: pre-wrap;
        border: 1px solid #2b2520;
        margin-bottom: 1.2rem;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="canvas" width="1280" height="800" tabindex="-1"></canvas>
    </div>

    <div id="launcher-ui">
      <div class="terminal-frame">
        <div class="header-meta">
          <span>CITY 17 SECTOR-4 TERMINAL</span>
          <span class="tag-id">LAMBDA // WASM</span>
        </div>

        <div class="brand-row">
          <div class="brand-title">HALF-LIFE 2</div>
          <div class="brand-sub">SRC-V1.0</div>
        </div>

        <div class="log-console">
          <div class="log-entry">> <span>MOUNT</span>: 33 DYNAMIC SHARED OBJECTS IDENTIFIED</div>
          <div class="log-entry">> <span>CHUNK_SYS</span>: SUB-50MB SPLIT PIPELINE READY</div>
          <div class="log-entry">> <span>TARGET_BIN</span>: HL2_LAUNCHER.JS</div>
        </div>

        <button id="btn-start" class="btn-terminal" onclick="startApp()" disabled>AWAITING ISOLATION...</button>

        <div id="progress-box">
          <div class="meter-labels">
            <span id="txt-status">STREAMING ASSETS</span>
            <span id="txt-pct">0%</span>
          </div>
          <div class="meter-rail">
            <div id="bar-fill" class="meter-fill"></div>
          </div>
          <div class="meter-sub">
            <span id="txt-file">Initializing chunk pipeline...</span>
            <span id="txt-bytes">0 MB / 420 MB</span>
          </div>
        </div>
      </div>
    </div>

    <div id="crash-overlay">
      <div class="crash-card">
        <div class="crash-title">ENGINE INTERCEPT FAULT</div>
        <pre id="crash-log" class="crash-pre"></pre>
        <button class="btn-terminal" onclick="location.reload()">RE-INITIALIZE CONTAINER</button>
      </div>
    </div>

    <script type="text/javascript">
      const canvasElement = document.getElementById('canvas');
      const launcherUi = document.getElementById('launcher-ui');
      const btnStart = document.getElementById('btn-start');
      const progressBox = document.getElementById('progress-box');
      const txtStatus = document.getElementById('txt-status');
      const txtPct = document.getElementById('txt-pct');
      const barFill = document.getElementById('bar-fill');
      const txtFile = document.getElementById('txt-file');
      const txtBytes = document.getElementById('txt-bytes');
      const crashOverlay = document.getElementById('crash-overlay');
      const crashLog = document.getElementById('crash-log');

      window.spinnerElement = document.createElement('div');
      window.statusElement = txtStatus;
      window.progressElement = document.createElement('progress');
      window.canvasElement = canvasElement;
      window.canvas = canvasElement;

      let g_totalExpected = 420 * 1024 * 1024;
      let g_downloaded = 0;
      let g_launched = false;
      let g_engineInitialized = false;

      function updateUI(status, file, bytesAdded) {
        if (status) txtStatus.textContent = status;
        if (file) txtFile.textContent = file;
        if (bytesAdded) g_downloaded += bytesAdded;

        const dlMB = (g_downloaded / (1024 * 1024)).toFixed(1);
        const totMB = (g_totalExpected / (1024 * 1024)).toFixed(1);
        txtBytes.textContent = `${dlMB} MB / ${totMB} MB`;

        const pct = Math.min(99, Math.round((g_downloaded / g_totalExpected) * 100));
        txtPct.textContent = `${pct}%`;
        barFill.style.width = `${pct}%`;
      }

      function showCrash(err) {
        let msg = '';
        if (err instanceof Error) {
          msg = err.stack || err.message;
        } else if (typeof err === 'string') {
          msg = err;
        } else if (err && err.message) {
          msg = err.message;
        } else {
          msg = 'Internal Runtime Exception';
        }
        crashLog.textContent = msg;
        crashOverlay.classList.add('active');
        canvasElement.style.cursor = 'default';
      }

      window.onerror = (m, u, l, c, e) => showCrash(e || m);
      window.onunhandledrejection = (e) => showCrash(e.reason);

      function checkIsolation() {
        if (window.crossOriginIsolated) {
          btnStart.disabled = false;
          btnStart.textContent = 'START ENGINE';
        } else {
          btnStart.disabled = true;
          btnStart.textContent = 'AWAITING ISOLATION...';
          if (navigator.serviceWorker && navigator.serviceWorker.controller) {
            window.location.reload();
          }
        }
      }

      checkIsolation();
      const isoInterval = setInterval(() => {
        checkIsolation();
        if (window.crossOriginIsolated) clearInterval(isoInterval);
      }, 400);

      // --- CURSOR AND POINTER LOCK FIX ---
      // Sync cursor appearance with actual pointer lock state
      document.addEventListener('pointerlockchange', () => {
        const isLocked = document.pointerLockElement === canvasElement;
        canvasElement.style.cursor = isLocked ? 'none' : 'default';
      });

      // Escape always unlocks the pointer cleanly
      window.addEventListener('keydown', (e) => {
        if (e.code === 'Escape' || e.key === 'Escape') {
          if (document.pointerLockElement) {
            document.exitPointerLock();
          }
        }
      });

      // Split chunk stitcher
      const SPLIT_FILES = {
        'background01.data': 5,
        'd1_canals_01.data': 2,
        'd1_canals_01a.data': 2,
        'd1_canals_07.data': 2,
        'd1_canals_11.data': 2,
        'd1_eli_01.data': 2,
        'd1_trainstation_01.data': 3,
        'd1_trainstation_02.data': 2,
        'd1_trainstation_03.data': 2,
        'd1_trainstation_04.data': 2,
        'd1_trainstation_05.data': 5,
        'd2_coast_03.data': 2,
        'd2_coast_09.data': 2
      };

      const origFetch = window.fetch.bind(window);
      const g_chunkAssembly = {};

      async function assembleChunks(baseName, totalParts) {
        if (g_chunkAssembly[baseName]) return g_chunkAssembly[baseName];

        g_chunkAssembly[baseName] = (async () => {
          const buffers = [];
          let totalLen = 0;
          for (let i = 1; i <= totalParts; i++) {
            const pad = String(i).padStart(4, '0');
            updateUI('ASSEMBLING CHUNKS', `${baseName} (.part${pad})`);
            const res = await origFetch(`chunks/${baseName}.part${pad}`);
            if (!res.ok) throw new Error(`Missing ${baseName}.part${pad}`);
            const buf = await res.arrayBuffer();
            updateUI(undefined, undefined, buf.byteLength);
            buffers.push(buf);
            totalLen += buf.byteLength;
          }

          const combined = new Uint8Array(totalLen);
          let offset = 0;
          for (let i = 0; i < buffers.length; i++) {
            combined.set(new Uint8Array(buffers[i]), offset);
            offset += buffers[i].byteLength;
            buffers[i] = null;
          }
          return combined.buffer;
        })();

        return g_chunkAssembly[baseName];
      }

      window.fetch = async function(input, init) {
        const url = (typeof input === 'string') ? input : (input && input.url) ? input.url : '';
        if (url.includes('save_console_log')) {
          return new Response('{"ok":true}', { status: 200, statusText: 'OK' });
        }

        if (url.includes('.part')) {
          return origFetch(input, init);
        }

        for (const [file, parts] of Object.entries(SPLIT_FILES)) {
          if (url.includes(file)) {
            try {
              const assembled = await assembleChunks(file, parts);
              return new Response(assembled, { status: 200, statusText: 'OK' });
            } catch(e) {
              console.error('[Chunk Assembly Error]:', e);
            }
          }
        }
        return origFetch(input, init);
      };

      const TARGET_ENGINE_SCRIPT = 'hl2_launcher.js';
      const SCRIPT_URL = new URL(TARGET_ENGINE_SCRIPT, window.location.href).href;
      const OrigWorker = window.Worker;

      window.Worker = function(scriptURL, options) {
        let target = scriptURL;
        if (!target || typeof target !== 'string' || target.endsWith('index.html') || target === window.location.href) {
          target = SCRIPT_URL;
        }
        return new OrigWorker(target, options);
      };

      window.Module = {
        canvas: canvasElement,
        canvasElement: canvasElement,
        locateFile: (p) => p.replace(/^.*[\\\/]/, ''),
        mainScriptUrlOrBlob: SCRIPT_URL,
        spinner: window.spinnerElement,
        statusElement: window.statusElement,
        progressElement: window.progressElement,

        arguments: [
          "-game", "hl2",
          "-w", "1280",
          "-h", "800",
          "-dxlevel", "90",
          "+mat_hdr_level", "0",
          "+mat_bumpmap", "0",
          "+mat_specular", "0",
          "+mat_motion_blur_enabled", "0",
          "+r_shadowrendertotexture", "0",
          "+r_flashlightdepthtexture", "0",
          "+mat_viewportscale", "1.0",
          "+mat_forcehardwaresync", "0",
          "+gl_can_resolve_fbo", "0",
          "+r_dynamic", "0"
        ],

        preRun: [
          function() {
            setInterval(() => {
              if (typeof runDependencyTracking !== 'undefined') {
                const hungList = ['load_game_data', 'loadDylibs', 'wasm-instantiate', 'idbfs_init'];
                for (const dep of hungList) {
                  if (runDependencyTracking[dep]) {
                    console.warn(`[Watchdog] Clearing hung dependency: ${dep}`);
                    try { Module.removeRunDependency(dep); } catch(e) {}
                  }
                }
              }
            }, 2500);

            try {
              const dirs = ["/hl2", "/hl2/cfg", "/hl2/custom", "/hl2/maps", "/platform"];
              dirs.forEach(d => {
                try { FS.mkdirTree(d); } catch (e) {}
              });

              const fallbackGameInfo = 
`"GameInfo"
{
\tgame\t\t"Half-Life 2"
\ttitle\t\t"HALF-LIFE 2"
\ttype\t\tsingleplayer_only
\tFileSystem
\t{
\t\tSteamAppId\t\t\t\t220
\t\tSearchPaths
\t\t{
\t\t\tGame\t\t\t\t|gameinfo_path|.
\t\t\tGame\t\t\t\thl2
\t\t}
\t}
}
`;
              FS.writeFile("/hl2/gameinfo.txt", fallbackGameInfo);
            } catch(e) {}
          }
        ],

        postRun: [
          function() {
            launcherUi.classList.add('hidden');
            g_engineInitialized = true;
          }
        ],

        print: function(text) {
          console.log("[Source Engine]:", text);
          if (text.includes("Game initializing") || text.includes("Host_Init") || text.includes("Map: background01")) {
            txtPct.textContent = '100%';
            barFill.style.width = '100%';
            updateUI('READY', 'Sector Loaded');
            setTimeout(() => {
              launcherUi.classList.add('hidden');
              g_engineInitialized = true;
              canvasElement.focus();
            }, 500);
          }
        },

        printErr: function(text) {
          if (text.includes("need to see wasm magic number") || text.includes("touch.cfg")) {
            return;
          }
          console.error("[Source Error]:", text);
        },

        setStatus: function(text) {
          if (!text) return;
          updateUI('INITIALIZING', text);
        },

        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          if (left > 0) {
            updateUI('LINKING', `Mounting ${left} runtime modules...`);
          }
        }
      };

      async function startApp() {
        if (!window.crossOriginIsolated) {
          alert('SharedArrayBuffer isolation is not active yet. Reloading...');
          window.location.reload();
          return;
        }

        if (g_launched) return;
        g_launched = true;

        btnStart.style.display = 'none';
        progressBox.style.display = 'block';
        updateUI('STARTING', 'Mounting hl2_launcher.js...');

        if (typeof AL !== 'undefined' && AL.currentCtx && AL.currentCtx.audioCtx && AL.currentCtx.audioCtx.state === 'suspended') {
          AL.currentCtx.audioCtx.resume();
        }

        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = TARGET_ENGINE_SCRIPT + '?v=' + Date.now();
        script.onerror = (e) => showCrash('Failed to load ' + TARGET_ENGINE_SCRIPT);
        document.body.appendChild(script);
      }
    </script>
  </body>
</html>
